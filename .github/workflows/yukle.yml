name: Siteyi guncelle
on:
  push:
    paths: ['.github/workflows/yukle.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dosyalari indir
        run: |
          set -e
          B=https://ewloaqmhqfsbalnyvwnu.supabase.co/storage/v1/object/public/gecici
          for f in index.html yonetim.html stil.css ortak.js sakin.js yonetim.js sw.js config.js; do
            curl -fsSL "$B/$f.txt" -o "$f"
          done
          for f in manifest.webmanifest ikon-192.png ikon-512.png ikon-maskable-512.png apple-touch-icon.png; do
            curl -fsSL "https://venusada.netlify.app/$f" -o "$f" || true
          done
          touch .nojekyll
          ls -la
      - name: Kaydet
        run: |
          git config user.name "venusada-bot"
          git config user.email "venusada-bot@users.noreply.github.com"
          git add -A
          git commit -m "Site dosyalari guncellendi" || echo "degisiklik yok"
          git push
